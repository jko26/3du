[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cork-3du"
version = "0.1.0"
description = "Static 3D reconstruction from walking-tour video: DA3 + residual remask + ODISE open-vocab instances."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy<2",
  "opencv-python-headless",
  "Pillow",
  "pyyaml",
  "matplotlib",
  "huggingface_hub",
  "safetensors",
  "einops>=0.8,<1",
  "tqdm",
  "scipy",
  "yt-dlp",
  "imageio",
  "imageio-ffmpeg",
  "faiss-cpu",
  "numba>=0.59,<0.61",
  "plyfile",
  "pandas",
  "prettytable",
  "trimesh",
  "scikit-learn",
  "addict",
  "evo",
  "moviepy==1.0.3",
  "pycolmap",
  "rich",
  "omegaconf>=2.2,<2.4",
  "requests",
  "hydra-core>=1.3.2",
  "iopath>=0.1.10",
  "decorator>=4.0.2,<6.0",
  "proglog<=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
3du = "cork3du.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
